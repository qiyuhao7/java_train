server:
  port: 9099

spring:
  application:
    name: pulsar-oss
  redis:
    host: localhost
    port: 6379

# Pulsar 配置
pulsar:
  service-url: pulsar://localhost:6650
  tenant: training
  namespace: dev
  topic: persistent://training/dev/order-events
  subscription: order-service-sub

# MinIO 对象存储配置
storage:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: training-files

# 上传文件大小限制
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 50MB
